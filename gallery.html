<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .gallery-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 600px;
            width: 100%;
        }

        .gallery-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 4/3;
        }

        .gallery-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-50%) scale(1.1);
        }

        .prev-btn {
            left: 15px;
        }

        .next-btn {
            right: 15px;
        }

        .gallery-info {
            padding: 20px;
            text-align: center;
            background: #f8f9fa;
        }

        .image-counter {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .image-title {
            color: #333;
            font-size: 18px;
            margin: 0;
        }

        .controls {
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            background: white;
            border-top: 1px solid #eee;
        }

        .control-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
            font-weight: bold;
        }

        .control-btn:hover {
            background: #764ba2;
        }

        .keyboard-hint {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <div class="gallery-wrapper">
            <img class="gallery-image" src="" alt="Gallery image">
            <button class="nav-button prev-btn" aria-label="Previous image">❮</button>
            <button class="nav-button next-btn" aria-label="Next image">❯</button>
        </div>
        <div class="gallery-info">
            <div class="image-counter">
                <span id="current-index">1</span> / <span id="total-images">0</span>
            </div>
            <p class="image-title" id="image-title">Image Gallery</p>
            <p class="keyboard-hint">Use arrow keys or buttons to navigate</p>
        </div>
        <div class="controls">
            <button class="control-btn prev-btn-text">← Previous</button>
            <button class="control-btn next-btn-text">Next →</button>
        </div>
    </div>

    <script src="gallery.js"></script>
</body>
</html>
